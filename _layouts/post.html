---
layout: default
---
<main class="post">
  <div class="post-head">
    <h1>{{ page.title | escape }}</h1>
    <div class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</div>
  </div>
  <article class="post-body">
    {{ content }}
  </article>
  <div class="post-back"><a href="{{ '/writing/' | relative_url }}">&larr; ALL WRITING</a></div>
</main>
