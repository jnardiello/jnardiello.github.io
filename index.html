---
layout: default
---

<author>
    <name>{{ site.author.name }}</name>
    <who>{{ site.author.description }}</who>
    <a href="/about/">About</a>
    <a href="{{ site.author.x.url }}" target="_blank">{{ site.author.x.name }}</a>
    <a href="{{ site.author.github.url }}" target="_blank">{{ site.author.github.name }}</a>
    <a href="{{ site.author.linkedin.url }}" target="_blank">{{ site.author.linkedin.name }}</a>
</author>
<h1>Articles</h1>
<articles>
    {% for post in site.posts limit:10 %}
        <article>
            <publication-date>{{ post.date | date_to_string }}</publication-date><headline><a href="{{ post.url }}">{{ post.title }}</a></headline>
        </article>
    {% endfor %}
</articles>
